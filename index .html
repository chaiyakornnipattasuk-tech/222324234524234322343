<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มองทะลุ.net</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>

/* ── RESET & BASE ─────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
    --bg:        #f8fafc;
    --white:     #ffffff;
    --black:     #000000;
    --s50:       #f8fafc;
    --s100:      #f1f5f9;
    --s200:      #e2e8f0;
    --s400:      #94a3b8;
    --s600:      #475569;
    --s700:      #334155;
    --sidebar-w: 220px;
    --fh:        'IBM Plex Sans Thai', sans-serif;
    --fb:        'Sarabun', sans-serif;
    --shadow:    4px 4px 0 #000;
    --shadow-lg: 8px 8px 0 #000;
    --border:    2px solid #000;
}
body        { font-family:var(--fb); background:var(--bg); color:var(--black); line-height:1.6; }
h1,h2,h3,h4 { font-family:var(--fh); font-weight:700; }
a           { text-decoration:none; color:inherit; }

/* ── LAYOUT ───────────────────────────────────────── */
.layout     { display:flex; min-height:100vh; }
.main       { flex:1; min-width:0; margin-left:var(--sidebar-w); }
.container  { max-width:1100px; margin:0 auto; padding:0 32px; }

/* ── SIDEBAR ──────────────────────────────────────── */
.sidebar {
    position: fixed;
    top: 0; left: 0;
    width: var(--sidebar-w);
    height: 100vh;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow-y: auto;
}
.sidebar-logo {
    padding: 32px 20px 24px;
    border-bottom: 1px solid #222;
}
.sidebar-logo h1 { font-size: 20px; color:#fff; margin-bottom:4px; }
.sidebar-logo p  { font-size: 11px; color:#6b7280; letter-spacing:.5px; }

.sidebar-nav { flex:1; padding: 16px 0; }
.nav-label   { font-size:10px; font-weight:700; letter-spacing:1.5px; color:#4b5563; padding:16px 20px 6px; text-transform:uppercase; }

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: #9ca3af;
    border-left: 3px solid transparent;
    transition: all .15s;
    font-family: var(--fb);
    background: none;
    border-top: none;
    border-right: none;
    border-bottom: none;
    width: 100%;
    text-align: left;
}
.nav-item:hover   { color:#fff; background:#111; }
.nav-item.active  { color:#fff; background:#111; border-left-color:#fff; }
.nav-item .icon   { font-size:18px; width:22px; text-align:center; }

.sidebar-footer {
    padding: 20px;
    border-top: 1px solid #222;
    font-size: 11px;
    color: #4b5563;
}

/* ── HEADER ───────────────────────────────────────── */
.page-header       { background:#fff; border-bottom:2px solid #000; padding:48px 0 32px; }
.page-header-small { background:#fff; border-bottom:2px solid #000; padding:28px 0; }
.page-title        { font-size:36px; margin-bottom:8px; }
.page-tagline      { font-size:16px; color:var(--s600); margin-bottom:28px; }

/* ── SEARCH ───────────────────────────────────────── */
.search-form  { display:flex; gap:8px; margin-bottom:20px; }
.search-input { flex:1; height:52px; font-size:17px; padding:0 18px; border:2px solid #000; font-family:inherit; background:#fff; outline:none; }
.search-input:focus { box-shadow:4px 4px 0 #000; }
.btn-search { padding:0 24px; height:52px; background:#000; color:#fff; border:2px solid #000; font-size:16px; font-weight:700; cursor:pointer; font-family:var(--fb); }
.btn-search:hover { background:#333; }

/* ── SUB-TABS ─────────────────────────────────────── */
.subtabs     { display:flex; gap:6px; background:var(--s100); border:2px solid #000; padding:4px; margin-bottom:20px; }
.subtab      { flex:1; padding:10px 20px; border:none; background:transparent; font-weight:600; cursor:pointer; font-size:15px; font-family:inherit; }
.subtab.active { background:#000; color:#fff; }
.subtab:hover:not(.active){ background:var(--s600); color:#fff; }

/* ── FILTER CHIPS ─────────────────────────────────── */
.filter-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
.chip         { padding:5px 14px; border:2px solid #000; background:#fff; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; }
.chip:hover   { background:var(--s100); }
.chip-active  { background:#000; color:#fff; }

/* ── CONTROLS ─────────────────────────────────────── */
.controls { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:4px; }
.select   { padding:10px 12px; border:2px solid #000; font-size:15px; font-family:inherit; background:#fff; cursor:pointer; }

/* ── GRID ─────────────────────────────────────────── */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; padding:36px 0; }

/* ── CASE CARD ────────────────────────────────────── */
.card        { background:#fff; border:2px solid #000; padding:22px; box-shadow:4px 4px 0 #000; cursor:pointer; transition:all .2s; position:relative; overflow:hidden; }
.card:hover  { box-shadow:8px 8px 0 #000; transform:translate(-2px,-2px); }
.card-title  { font-size:18px; margin-bottom:10px; font-family:var(--fh); }
.card:hover .card-title { text-decoration:underline; }
.card-text   { color:var(--s700); margin:10px 0; font-size:14px; line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card-meta   { display:flex; justify-content:space-between; font-size:13px; color:var(--s600); margin-top:14px; }
.card::after { content:''; position:absolute; bottom:-28px; right:-28px; width:56px; height:56px; background:var(--s100); transform:rotate(45deg); }

/* ── POLITICIAN CARD ──────────────────────────────── */
.pol-card    { background:#fff; border:2px solid #000; padding:22px; box-shadow:4px 4px 0 #000; cursor:pointer; transition:all .2s; position:relative; overflow:hidden; }
.pol-card:hover { box-shadow:8px 8px 0 #000; transform:translate(-2px,-2px); }
.pol-avatar  { width:52px; height:52px; background:#000; color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:14px; flex-shrink:0; }
.pol-name    { font-size:18px; font-family:var(--fh); margin-bottom:4px; }
.pol-party   { font-size:13px; color:var(--s600); margin-bottom:12px; font-weight:600; }
.pol-section-label { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--s400); margin-bottom:4px; }
.pol-section-text  { font-size:13px; color:var(--s700); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:12px; }
.pol-card::after { content:''; position:absolute; bottom:-28px; right:-28px; width:56px; height:56px; background:var(--s100); transform:rotate(45deg); }

/* ── BADGES ───────────────────────────────────────── */
.badge           { display:inline-block; padding:3px 10px; font-size:11px; font-weight:700; text-transform:uppercase; border:1px solid; }
.badge-ongoing   { background:#fef3c7; color:#92400e; border-color:#92400e; }
.badge-guilty    { background:#fecaca; color:#991b1b; border-color:#991b1b; }
.badge-acquitted { background:#d1fae5; color:#065f46; border-color:#065f46; }
.badge-settled   { background:var(--s100); color:var(--s700); border-color:var(--s700); }
.badge-dismissed { background:#ede9fe; color:#5b21b6; border-color:#5b21b6; }

/* ── DETAIL PAGE ──────────────────────────────────── */
.btn-back  { background:transparent; border:none; font-size:15px; margin-bottom:14px; cursor:pointer; padding:8px; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.btn-back:hover { background:var(--s100); }
.detail-header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
.meta          { display:flex; gap:14px; align-items:center; margin-top:10px; flex-wrap:wrap; }
.content-section { background:#fff; border:2px solid #000; padding:24px; margin-bottom:20px; box-shadow:4px 4px 0 rgba(0,0,0,.08); }
.content-section h2 { margin-bottom:16px; font-size:20px; }

/* ── TIMELINE vertical ────────────────────────────── */
.timeline-vertical        { position:relative; padding-left:44px; }
.timeline-vertical::before{ content:''; position:absolute; left:14px; top:0; bottom:0; width:2px; background:#000; }
.timeline-item            { position:relative; margin-bottom:24px; }
.timeline-item::before    { content:'📅'; position:absolute; left:-38px; width:28px; height:28px; background:#000; display:flex; align-items:center; justify-content:center; font-size:13px; }
.timeline-box             { background:var(--s50); border:1px solid #cbd5e1; padding:14px; }
.timeline-date            { font-weight:700; font-size:13px; margin-bottom:5px; }
.timeline-source          { font-size:12px; margin-top:7px; color:var(--s600); }
.timeline-source a        { color:#2563eb; text-decoration:underline; }

/* ── TIMELINE horizontal ──────────────────────────── */
.timeline-horizontal  { display:flex; overflow-x:auto; padding:28px 0; }
.timeline-h-item      { display:flex; align-items:flex-start; min-width:240px; }
.timeline-h-node      { width:40px; height:40px; background:#000; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.timeline-h-content   { margin-top:10px; background:var(--s50); border:2px solid #cbd5e1; padding:12px; min-height:140px; width:220px; font-size:13px; }
.timeline-h-connector { width:44px; height:2px; background:#000; margin-top:20px; flex-shrink:0; }

/* ── POLITICIAN DETAIL ────────────────────────────── */
.pol-profile-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.pol-field        { margin-bottom:0; }
.pol-field-label  { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--s400); margin-bottom:5px; }
.pol-field-value  { font-size:15px; color:#000; line-height:1.6; }
.pol-field-full   { grid-column:1/-1; }

/* finance bar */
.finance-section  { margin-top:8px; }
.networth-display { font-size:28px; font-family:var(--fh); font-weight:700; margin-bottom:20px; }
.networth-label   { font-size:13px; color:var(--s600); font-weight:400; margin-left:8px; }
.fund-bar-wrap  { margin-bottom:24px; }
.fund-bar       { display:flex; height:44px; border:2px solid #000; overflow:hidden; box-shadow:4px 4px 0 #000; }
.fund-segment   { display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; transition:flex .4s; overflow:hidden; white-space:nowrap; }
.fund-seg-people    { background:#1d4ed8; }
.fund-seg-corporate { background:#dc2626; }
.fund-seg-undefined { background:#7c3aed; }
.fund-legend     { display:flex; gap:20px; flex-wrap:wrap; margin-top:14px; }
.fund-legend-item{ display:flex; align-items:center; gap:8px; font-size:13px; }
.fund-dot        { width:14px; height:14px; flex-shrink:0; border:1px solid rgba(0,0,0,.2); }
.fund-dot-people    { background:#1d4ed8; }
.fund-dot-corporate { background:#dc2626; }
.fund-dot-undefined { background:#7c3aed; }
.linked-case-card { background:var(--s50); border:1px solid var(--s200); padding:14px; margin-bottom:10px; cursor:pointer; transition:all .15s; }
.linked-case-card:hover { background:#fff; border-color:#000; }

/* ── POLITICIAN TIMELINES ─────────────────────────── */
.pol-timeline     { display:flex; flex-direction:column; gap:0; padding-left:36px; position:relative; }
.pol-tl-item      { display:flex; align-items:flex-start; gap:16px; position:relative; margin-bottom:4px; }
.pol-tl-dot       { width:32px; height:32px; border-radius:0; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; margin-left:-36px; z-index:1; }
.pol-tl-line      { position:absolute; left:-20px; top:32px; bottom:-4px; width:2px; }
.pol-tl-item:last-child .pol-tl-line { display:none; }
.pol-tl-box       { flex:1; border:1px solid; padding:14px; margin-bottom:12px; }
.pol-tl-date      { font-size:12px; font-weight:700; letter-spacing:.5px; margin-bottom:5px; }
.pol-tl-desc      { font-size:14px; line-height:1.6; color:#000; }
.tl-tabs          { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
.tl-tab           { padding:8px 18px; border:2px solid #000; background:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
.tl-tab.active    { background:#000; color:#fff; }
.tl-tab:hover:not(.active) { background:var(--s100); }

/* ─────────────────────────────────────────────────────────
   ส่งข้อเสนอ — SEND SECTION STYLES
───────────────────────────────────────────────────────── */

/* Section nav tabs (search / district) */
.section-nav { display:flex; gap:0; margin-bottom:28px; border:var(--border); overflow:hidden; width:fit-content; }
.snav-btn    { padding:10px 22px; border:none; border-right:var(--border); font-size:15px; font-family:var(--fh); font-weight:600; cursor:pointer; background:#fff; color:#000; transition:background .12s; }
.snav-btn:last-child { border-right:none; }
.snav-btn.active { background:#000; color:#fff; }
.snav-btn:hover:not(.active) { background:var(--s100); }

/* Party filter chips (send section) */
.send-chip { padding:6px 14px; border:2px solid #000; font-size:13px; font-family:var(--fh); font-weight:600; cursor:pointer; background:#fff; transition:all .1s; user-select:none; }
.send-chip:hover { box-shadow:2px 2px 0 #000; }
.send-chip.active { background:#000; color:#fff; }
.send-chip[data-party="ก้าวไกล"].active    { background:#F97316; border-color:#F97316; color:#fff; }
.send-chip[data-party="เพื่อไทย"].active   { background:#EC1C24; border-color:#EC1C24; color:#fff; }
.send-chip[data-party="ประชาธิปัตย์"].active { background:#004DA8; border-color:#004DA8; color:#fff; }
.send-chip[data-party="ภูมิใจไทย"].active  { background:#00AEEF; border-color:#00AEEF; color:#fff; }
.send-chip[data-party="พลังประชารัฐ"].active { background:#002868; border-color:#002868; color:#fff; }

/* Party badge inside contact card */
.party-badge { display:inline-block; padding:2px 10px; font-size:12px; font-weight:700; font-family:var(--fh); border:1.5px solid #000; background:#000; color:#fff; margin-bottom:10px; }
.party-badge[data-p="ก้าวไกล"]    { background:#F97316; border-color:#F97316; }
.party-badge[data-p="เพื่อไทย"]  { background:#EC1C24; border-color:#EC1C24; }
.party-badge[data-p="ประชาธิปัตย์"] { background:#004DA8; border-color:#004DA8; }
.party-badge[data-p="ภูมิใจไทย"]  { background:#00AEEF; border-color:#00AEEF; }
.party-badge[data-p="พลังประชารัฐ"] { background:#002868; border-color:#002868; }

/* Politician search grid (send section) */
.send-pol-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; padding:20px 0; }

/* When a card is expanded, collapse the whole grid to show only it */
.send-pol-grid.has-expanded { grid-template-columns:1fr; }
.send-pol-grid.has-expanded .send-pol-card { display:none; }
.send-pol-grid.has-expanded .send-pol-card.expanded { display:grid; }

/* Compact (collapsed) card */
.send-pol-card {
    background:#fff; border:2px solid #000; padding:18px;
    box-shadow:4px 4px 0 #000; cursor:pointer; transition:box-shadow .15s, transform .15s;
}
.send-pol-card:hover:not(.expanded) { box-shadow:7px 7px 0 #000; transform:translate(-2px,-2px); }

/* Expanded card — full-width two-column layout */
.send-pol-card.expanded {
    grid-template-columns:1fr 1fr;
    gap:0;
    cursor:default;
    box-shadow:6px 6px 0 #000;
    transform:none;
    background:#fff;
    border:2px solid #000;
    padding:0;
}

/* Left pane of expanded card */
.spc-left {
    padding:28px 28px 28px 28px;
    border-right:2px solid #000;
    display:flex; flex-direction:column; gap:0;
}
/* Right pane of expanded card */
.spc-right {
    padding:28px;
    display:flex; flex-direction:column; gap:14px;
}

/* Back button inside expanded card */
.spc-back {
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:700; font-family:var(--fh);
    background:none; border:none; cursor:pointer; padding:0;
    color:var(--s600); margin-bottom:16px;
}
.spc-back:hover { color:#000; }

.send-pol-name { font-family:var(--fh); font-size:17px; font-weight:700; margin-bottom:4px; }
.send-pol-pos  { font-size:13px; color:var(--s600); margin-bottom:8px; }
.send-pol-reg  { font-size:13px; color:#777; }

/* Expanded: contact links inside card */
.spc-links { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
@media (max-width:700px) {
    .send-pol-card.expanded { grid-template-columns:1fr; }
    .spc-left { border-right:none; border-bottom:2px solid #000; }
    .spc-links { grid-template-columns:1fr; }
}

/* District result boxes */
.district-result {
    margin-top:16px; padding:16px;
    background:#f0fdf4; border:2px solid #16a34a; box-shadow:4px 4px 0 #16a34a;
    display:none;
}
.district-result.visible { display:block; }
.district-not-found {
    margin-top:16px; padding:16px;
    background:#fef2f2; border:2px solid #dc2626; box-shadow:4px 4px 0 #dc2626;
    display:none; color:#dc2626; font-weight:600; font-size:14px;
}
.district-not-found.visible { display:block; }
.dr-label { font-size:12px; color:#555; margin-bottom:4px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.dr-fullname { font-size:19px; font-weight:700; font-family:var(--fh); margin-bottom:2px; }
.dr-sub { font-size:14px; color:#333; margin-bottom:12px; }
.dr-goto { padding:8px 18px; background:#16a34a; color:#fff; border:2px solid #000; box-shadow:3px 3px 0 #000; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--fh); display:inline-block; }
.dr-goto:hover { box-shadow:none; transform:translate(3px,3px); }

/* Contact panel */
.contact-panel { display:none; }
.contact-panel.visible { display:block; }

.contact-two-col { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }

.contact-avatar {
    width:72px; height:72px; background:#000; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:700; font-family:var(--fh);
    border:2px solid #000; box-shadow:3px 3px 0 #aaa; flex-shrink:0;
}
.contact-fullname { font-size:22px; font-weight:700; font-family:var(--fh); margin-bottom:4px; }
.contact-pos-line { font-size:13px; color:var(--s600); margin-bottom:6px; }
.districts-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.district-tag { padding:2px 9px; border:1.5px solid #ccc; font-size:11px; background:var(--s100); color:#555; }

.contact-links { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:0; }
.cl-item {
    display:flex; align-items:center; gap:10px;
    padding:11px 13px; border:2px solid #000; background:#fff;
    font-size:13px; cursor:pointer; transition:all .1s;
    box-shadow:2px 2px 0 #000; text-decoration:none; color:#000;
}
.cl-item:hover { box-shadow:4px 4px 0 #000; transform:translate(-1px,-1px); }
.cl-item .cl-icon { font-size:18px; flex-shrink:0; }
.cl-item .cl-label { font-weight:700; font-size:12px; }
.cl-item .cl-val   { font-size:11px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cl-email  { border-color:#1d4ed8; background:#EFF6FF; }
.cl-phone  { border-color:#16a34a; background:#F0FDF4; }
.cl-fb     { border-color:#1877F2; background:#EFF6FF; }
.cl-line   { border-color:#06C755; background:#EFFFF5; }
.cl-tw     { border-color:#1DA1F2; background:#EFF8FF; }
.cl-ig     { border-color:#E1306C; background:#FFF0F5; }
.cl-web    { border-color:#7c3aed; background:#F5F3FF; }

/* Topic accordion dropdown */
.topic-dropdown { position: relative; width: 100%; }

.topic-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 11px 14px;
    border: 2px solid #000;
    background: #fff;
    font-size: 14px;
    font-family: var(--fh);
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    box-shadow: 3px 3px 0 #000;
    transition: box-shadow .1s, transform .1s;
    color: #000;
}
.topic-trigger:hover { box-shadow: 4px 4px 0 #000; transform: translate(-1px,-1px); }
.topic-trigger.open  { box-shadow: none; transform: translate(3px,3px); background: #000; color: #fff; }

.topic-trigger .tt-left  { display:flex; align-items:center; gap:8px; }
.topic-trigger .tt-icon  { font-size: 18px; }
.topic-trigger .tt-label { font-size: 14px; }
.topic-trigger .tt-arrow {
    font-size: 11px;
    transition: transform .2s;
    flex-shrink: 0;
    opacity: .6;
}
.topic-trigger.open .tt-arrow { transform: rotate(180deg); }

/* The dropdown list — hidden by default, slides open */
.topic-list {
    width: 100%;
    border: 2px solid #000;
    border-top: none;
    background: #fff;
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s cubic-bezier(.4,0,.2,1);
    box-shadow: 3px 3px 0 #000;
}
.topic-list.open { max-height: 340px; overflow-y: auto; }

.topic-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--s100);
    font-size: 14px;
    font-family: var(--fh);
    font-weight: 600;
    color: var(--s700);
    transition: background .1s;
    background: #fff;
    border-left: none;
    border-right: none;
    border-top: none;
    width: 100%;
    text-align: left;
}
.topic-list-item:last-child { border-bottom: none; }
.topic-list-item:hover { background: var(--s100); color: #000; }
.topic-list-item.active {
    background: #000;
    color: #fff;
}
.topic-list-item .tli-icon  { font-size: 18px; flex-shrink: 0; }
.topic-list-item .tli-en    { font-size: 11px; opacity: .55; margin-left: auto; font-weight: 400; white-space: nowrap; }
.compose-toggle { display:flex; border:var(--border); overflow:hidden; width:fit-content; margin-bottom:14px; }
.toggle-btn { padding:9px 18px; border:none; border-right:var(--border); font-size:13px; font-family:var(--fh); font-weight:700; cursor:pointer; background:#fff; color:#000; transition:background .12s; }
.toggle-btn:last-child { border-right:none; }
.toggle-btn.active { background:#000; color:#fff; }

.anon-note { display:flex; align-items:flex-start; gap:8px; padding:10px 14px; background:#FFFBEB; border:2px solid #D97706; font-size:13px; color:#78350F; margin-bottom:14px; line-height:1.5; }
.identity-fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.identity-fields.hidden { display:none; }

.form-group { display:flex; flex-direction:column; gap:5px; }
.form-label { font-size:12px; font-weight:700; font-family:var(--fh); text-transform:uppercase; letter-spacing:.5px; color:var(--s600); }
.form-input { padding:10px 13px; border:var(--border); font-size:14px; font-family:var(--fb); background:#fff; outline:none; transition:box-shadow .1s; }
.form-input:focus { box-shadow:3px 3px 0 #000; }
.form-textarea { padding:11px 13px; border:var(--border); font-size:14px; font-family:var(--fb); background:#fff; outline:none; resize:vertical; min-height:110px; width:100%; transition:box-shadow .1s; }
.form-textarea:focus { box-shadow:3px 3px 0 #000; }
.char-count { font-size:11px; color:#999; text-align:right; margin-top:3px; }

.send-btn {
    width:100%; padding:14px; background:#000; color:#fff;
    border:var(--border); box-shadow:4px 4px 0 #000;
    font-size:16px; font-weight:700; font-family:var(--fh);
    cursor:pointer; transition:all .1s;
    display:flex; align-items:center; justify-content:center; gap:8px;
}
.send-btn:hover { box-shadow:6px 6px 0 #000; transform:translate(-1px,-1px); }
.send-btn:active { box-shadow:none; transform:translate(4px,4px); }
.send-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:4px 4px 0 #000; }
.send-tip { font-size:11px; color:#888; text-align:center; margin-top:10px; line-height:1.5; }

/* Empty contact state */
.empty-contact { text-align:center; padding:56px 20px; color:#aaa; background:#fff; border:2px solid var(--s200); }
.empty-contact .big-icon { font-size:44px; margin-bottom:10px; }
.empty-contact p { font-size:15px; }

/* No results */
.no-results { text-align:center; padding:32px; color:var(--s600); grid-column:1/-1; font-size:15px; }

/* Toast */
.toast {
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(120px);
    background:#000; color:#fff; padding:13px 24px;
    font-family:var(--fh); font-weight:700; font-size:14px;
    box-shadow:4px 4px 0 #555;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index:999; white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); }

/* ── FOOTER ───────────────────────────────────────── */
.footer           { background:#000; color:#fff; padding:56px 0 36px; margin-top:56px; }
.footer-grid      { display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-bottom:40px; }
.footer h2        { font-size:26px; margin-bottom:6px; color:#fff; }
.footer h3        { font-size:17px; margin-bottom:14px; color:#fff; border-bottom:1px solid #333; padding-bottom:9px; }
.footer-tagline   { color:#9ca3af; font-size:15px; margin-bottom:20px; }
.footer p         { color:#d1d5db; line-height:1.8; font-size:14px; margin-bottom:10px; }
.footer-principles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.principle-card   { border:1px solid #333; padding:14px; }
.principle-card .icon { font-size:20px; margin-bottom:6px; }
.principle-card h4{ font-size:13px; font-weight:700; color:#fff; margin-bottom:5px; }
.principle-card p { font-size:12px; color:#9ca3af; margin:0; line-height:1.5; }
.footer-divider   { border:none; border-top:1px solid #222; margin:28px 0; }
.footer-bottom    { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.footer-bottom p  { color:#6b7280; font-size:12px; margin:0; }
.ideology-badge   { display:inline-block; background:#111; border:1px solid #333; color:#9ca3af; font-size:11px; padding:3px 10px; font-weight:600; }

/* ── UTILITIES ────────────────────────────────────── */
.empty { text-align:center; padding:48px; font-size:17px; color:var(--s600); background:#fff; border:2px solid var(--s100); }
.section-pad { padding:36px 0; }

/* ── RESPONSIVE ───────────────────────────────────── */
@media (max-width: 768px) {
    .sidebar          { width: 56px; }
    .sidebar-logo     { display:none; }
    .nav-label        { display:none; }
    .nav-item         { padding:14px 0; justify-content:center; border-left-width:3px; }
    .nav-item .label  { display:none; }
    .nav-item .icon   { font-size:22px; width:auto; }
    .sidebar-footer   { display:none; }
    .main             { margin-left:56px; }
    .container        { padding:0 12px; }
    .page-title       { font-size:24px; }
    .grid             { grid-template-columns:1fr; }
    .pol-profile-grid { grid-template-columns:1fr; }
    .footer-grid      { grid-template-columns:1fr; gap:28px; }
    .footer-principles{ grid-template-columns:1fr; }
    .footer-bottom    { flex-direction:column; align-items:flex-start; }
    .detail-header    { flex-direction:column; }
    .timeline-horizontal { flex-direction:column; }
    .timeline-h-connector{ display:none; }
    .fund-legend      { gap:12px; }
    .contact-two-col  { grid-template-columns:1fr; }

}

    </style>
</head>
<body>

<!-- ── SIDEBAR ───────────────────────────── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <h1>มองทะลุ.net</h1>
        <p>HARDER TO SEE THAN FLOW IS NORM</p>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-label">เมนูหลัก</div>

        <button class="nav-item active" data-section="cases" id="nav-cases" title="คดีความ">
            <span class="icon">⚖️</span> <span class="label">คดีความ</span>
        </button>

        <button class="nav-item" data-section="politicians" id="nav-politicians" title="นักการเมือง">
            <span class="icon">🏛️</span> <span class="label">นักการเมือง</span>
        </button>

        <button class="nav-item" data-section="send" id="nav-send" title="ส่งข้อเสนอ">
            <span class="icon">📨</span> <span class="label">ส่งข้อเสนอ</span>
        </button>
    </nav>

    <div class="sidebar-footer">
        ข้อมูลจากแหล่งสาธารณะ<br>อัปเดตโดยทีมงาน
    </div>
</aside>

<!-- ── MAIN ───────────────────────────────── -->
<div class="layout">
    <main class="main" id="app"></main>
</div>

<!-- Toast -->
<div class="toast" id="toast">✅ เปิดโปรแกรมอีเมลแล้ว</div>

<script>
// ============================================================
//  🛑  WEBSITE CODE — DO NOT EDIT BELOW UNTIL DATA SECTION
// ============================================================

const STATUS_LABELS = {
    ongoing:   'กำลังดำเนินการ',
    guilty:    'มีความผิด',
    acquitted: 'ยกฟ้อง (พ้นผิด)',
    settled:   'ประนีประนอมยอมความ',
    dismissed: 'จำหน่ายคดี'
};

const STATUS_FILTERS = [
    { key:'all',       label:'ทั้งหมด' },
    { key:'ongoing',   label:'กำลังดำเนินการ' },
    { key:'guilty',    label:'มีความผิด' },
    { key:'acquitted', label:'ยกฟ้อง' },
    { key:'settled',   label:'ประนีประนอมยอมความ' },
    { key:'dismissed', label:'จำหน่ายคดี' },
];

let currentSection = 'cases';
let currentTab     = 'case';
let currentSearch  = '';
let currentStatus  = 'all';

// ── SIDEBAR NAV ───────────────────────────────────────────
document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
    btn.addEventListener('click', () => {
        currentSection = btn.dataset.section;
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (currentSection === 'cases') {
            currentSearch = ''; currentStatus = 'all';
            navigate('/');
        } else if (currentSection === 'politicians') {
            navigate('/politicians');
        } else {
            navigate('/send');
        }
    });
});

// ── ROUTING ───────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    handleRoute();
    window.addEventListener('hashchange', handleRoute);
});

function handleRoute() {
    const hash = window.location.hash.slice(1) || '/';
    if (hash === '/' || hash === '') {
        currentSection = 'cases'; setActiveNav('nav-cases'); showCasesPage();
    } else if (hash === '/politicians') {
        currentSection = 'politicians'; setActiveNav('nav-politicians'); showPoliticiansPage();
    } else if (hash === '/send') {
        currentSection = 'send'; setActiveNav('nav-send'); showSendPage();
    } else if (hash.startsWith('/case/') || hash.startsWith('/company/')) {
        showCaseDetail(hash.split('/')[2]);
    } else if (hash.startsWith('/politician/')) {
        showPoliticianDetail(hash.split('/')[2]);
    } else {
        navigate('/');
    }
}

function navigate(path) { window.location.hash = path; }

function setActiveNav(id) {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(id)?.classList.add('active');
}

// ── CASES PAGE ────────────────────────────────────────────
function showCasesPage() {
    document.getElementById('app').innerHTML = `
        <div>
            <div class="page-header">
                <div class="container">
                    <h1 class="page-title">คดีความ</h1>
                    <p class="page-tagline">ติดตามสถานะคดีบุคคลและนิติบุคคล</p>
                    <form class="search-form" id="search-form">
                        <input type="text" id="search-input" class="search-input"
                            placeholder="ค้นหาชื่อ, ข้อกล่าวหา..." value="${currentSearch}">
                        <button type="submit" class="btn-search">ค้นหา</button>
                    </form>
                    <div class="subtabs">
                        <button class="subtab ${currentTab==='case'?'active':''}" data-tab="case">👤 คดีบุคคล</button>
                        <button class="subtab ${currentTab==='company'?'active':''}" data-tab="company">🏢 บริษัท</button>
                    </div>
                    <div class="filter-chips">
                        ${STATUS_FILTERS.map(f=>`
                            <button class="chip ${currentStatus===f.key?'chip-active':''}"
                                data-status="${f.key}">${f.label}</button>
                        `).join('')}
                    </div>
                    <div class="controls">
                        <select id="sort-select" class="select">
                            <option value="most_events">อัปเดตบ่อยสุด</option>
                            <option value="least_events">อัปเดตน้อยสุด</option>
                            <option value="alpha_asc">ชื่อ ก–ฮ</option>
                            <option value="alpha_desc">ชื่อ ฮ–ก</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="container"><div id="cases-grid" class="grid"></div></div>
            ${renderFooter()}
        </div>
    `;
    document.getElementById('search-form').addEventListener('submit', e => {
        e.preventDefault();
        currentSearch = document.getElementById('search-input').value.trim();
        renderCasesGrid();
    });
    document.querySelectorAll('.subtab').forEach(tab => {
        tab.addEventListener('click', () => {
            currentTab = tab.dataset.tab; currentSearch = ''; currentStatus = 'all'; showCasesPage();
        });
    });
    document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            currentStatus = chip.dataset.status;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('chip-active'));
            chip.classList.add('chip-active');
            renderCasesGrid();
        });
    });
    document.getElementById('sort-select').addEventListener('change', renderCasesGrid);
    renderCasesGrid();
}

function renderCasesGrid() {
    const sortBy = document.getElementById('sort-select').value;
    let items = DATA.filter(d => d.type === currentTab);
    if (currentStatus !== 'all') items = items.filter(d => d.status === currentStatus);
    if (currentSearch) {
        const q = currentSearch.toLowerCase();
        items = items.filter(d =>
            d.name.toLowerCase().includes(q) || d.allegations.toLowerCase().includes(q)
        );
    }
    if (sortBy === 'most_events')  items.sort((a,b) => b.timeline.length - a.timeline.length);
    if (sortBy === 'least_events') items.sort((a,b) => a.timeline.length - b.timeline.length);
    if (sortBy === 'alpha_asc')    items.sort((a,b) => a.name.localeCompare(b.name,'th'));
    if (sortBy === 'alpha_desc')   items.sort((a,b) => b.name.localeCompare(a.name,'th'));
    const grid = document.getElementById('cases-grid');
    if (items.length === 0) { grid.innerHTML = '<div class="empty">ไม่พบข้อมูล</div>'; return; }
    grid.innerHTML = items.map(c => `
        <div class="card" data-id="${c.id}" data-type="${c.type}">
            <h3 class="card-title">${c.name}</h3>
            <span class="badge badge-${c.status}">${STATUS_LABELS[c.status]||c.status}</span>
            <p class="card-text">${c.allegations}</p>
            <div class="card-meta"><span>📋 ${c.timeline.length} เหตุการณ์</span></div>
        </div>
    `).join('');
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => navigate(`/${card.dataset.type}/${card.dataset.id}`));
    });
}

// ── CASE DETAIL ───────────────────────────────────────────
function showCaseDetail(id) {
    const data = DATA.find(d => d.id === id);
    if (!data) { navigate('/'); return; }
    const timelineHtml = data.type === 'company'
        ? renderHorizontalTimeline(data.timeline)
        : renderVerticalTimeline(data.timeline);
    document.getElementById('app').innerHTML = `
        <div>
            <div class="page-header-small">
                <div class="container">
                    <button class="btn-back" id="back-btn">← กลับ</button>
                    <div class="detail-header">
                        <div>
                            <h1 class="page-title">${data.name}</h1>
                            <div class="meta">
                                <span class="badge badge-${data.status}">${STATUS_LABELS[data.status]||data.status}</span>
                                <span style="color:var(--s600);font-size:13px;">${data.timeline.length} เหตุการณ์</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container section-pad">
                <div class="content-section"><h2>ข้อกล่าวหา</h2><p>${data.allegations}</p></div>
                <div class="content-section"><h2>ไทม์ไลน์</h2>${timelineHtml}</div>
            </div>
            ${renderFooter()}
        </div>
    `;
    document.getElementById('back-btn').addEventListener('click', () => navigate('/'));
}

// ── POLITICIANS PAGE ──────────────────────────────────────
function showPoliticiansPage() {
    document.getElementById('app').innerHTML = `
        <div>
            <div class="page-header">
                <div class="container">
                    <h1 class="page-title">นักการเมือง</h1>
                    <p class="page-tagline">ประวัติ ผลงาน และความโปร่งใสทางการเงิน</p>
                    <form class="search-form" id="pol-search-form">
                        <input type="text" id="pol-search-input" class="search-input"
                            placeholder="ค้นหาชื่อ, พรรค, นโยบาย...">
                        <button type="submit" class="btn-search">ค้นหา</button>
                    </form>
                </div>
            </div>
            <div class="container">
                <div id="pol-grid" class="grid section-pad"></div>
            </div>
            ${renderFooter()}
        </div>
    `;
    document.getElementById('pol-search-form').addEventListener('submit', e => {
        e.preventDefault();
        renderPoliticiansGrid(document.getElementById('pol-search-input').value.trim());
    });
    renderPoliticiansGrid('');
}

function renderPoliticiansGrid(search) {
    let items = [...POLITICIANS];
    if (search) {
        const q = search.toLowerCase();
        items = items.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.party.toLowerCase().includes(q) ||
            (p.campaign||'').toLowerCase().includes(q)
        );
    }
    const grid = document.getElementById('pol-grid');
    if (items.length === 0) { grid.innerHTML = '<div class="empty">ไม่พบข้อมูล</div>'; return; }
    grid.innerHTML = items.map(p => `
        <div class="pol-card" data-id="${p.id}">
            <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;">
                <div class="pol-avatar">🏛️</div>
                <div>
                    <div class="pol-name">${p.name}</div>
                    <div class="pol-party">🏳️ ${p.party} ${p.position ? '· '+p.position : ''}</div>
                </div>
            </div>
            <div class="pol-section-label">ผลงานที่ผ่านมา</div>
            <div class="pol-section-text">${p.accomplishments || '—'}</div>
            <div class="pol-section-label">นโยบายหาเสียง</div>
            <div class="pol-section-text">${p.campaign || '—'}</div>
            <div style="margin-top:10px;">${renderMiniFinanceBar(p.finance)}</div>
        </div>
    `).join('');
    document.querySelectorAll('.pol-card').forEach(card => {
        card.addEventListener('click', () => navigate(`/politician/${card.dataset.id}`));
    });
}

function renderMiniFinanceBar(finance) {
    if (!finance) return '';
    const { pPct, cPct, uPct } = calcFinance(finance);
    return `
        <div style="font-size:11px;color:var(--s400);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;">สัดส่วนแหล่งทุน</div>
        <div style="display:flex;height:10px;border:1px solid #000;overflow:hidden;">
            ${pPct > 0 ? `<div style="flex:${pPct};background:#1d4ed8;"></div>` : ''}
            ${cPct > 0 ? `<div style="flex:${cPct};background:#dc2626;"></div>` : ''}
            ${uPct > 0 ? `<div style="flex:${uPct};background:#7c3aed;"></div>` : ''}
        </div>
    `;
}

// ── POLITICIAN DETAIL ─────────────────────────────────────
function showPoliticianDetail(id) {
    const p = POLITICIANS.find(x => x.id === id);
    if (!p) { navigate('/politicians'); return; }
    const linked = (p.linkedCases || []).map(cid => DATA.find(d => d.id === cid)).filter(Boolean);

    document.getElementById('app').innerHTML = `
        <div>
            <div class="page-header-small">
                <div class="container">
                    <button class="btn-back" id="back-btn">← กลับ</button>
                    <div class="detail-header">
                        <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;">
                            <div class="pol-avatar" style="width:64px;height:64px;font-size:28px;">🏛️</div>
                            <div>
                                <h1 class="page-title">${p.name}</h1>
                                <div class="meta">
                                    <span style="font-weight:700;color:var(--s600);">🏳️ ${p.party}</span>
                                    ${p.position ? `<span style="color:var(--s600);font-size:13px;">${p.position}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container section-pad">
                <!-- PROFILE -->
                <div class="content-section">
                    <h2>ข้อมูลส่วนตัว</h2>
                    <div class="pol-profile-grid">
                        <div class="pol-field"><div class="pol-field-label">ชื่อ–นามสกุล</div><div class="pol-field-value">${p.name}</div></div>
                        <div class="pol-field"><div class="pol-field-label">พรรคการเมือง</div><div class="pol-field-value">${p.party}</div></div>
                        ${p.position ? `<div class="pol-field"><div class="pol-field-label">ตำแหน่ง</div><div class="pol-field-value">${p.position}</div></div>` : ''}
                        ${p.region ? `<div class="pol-field"><div class="pol-field-label">เขตเลือกตั้ง / จังหวัด</div><div class="pol-field-value">${p.region}</div></div>` : ''}
                    </div>
                </div>
                <!-- 3 TIMELINES -->
                <div class="content-section">
                    <h2 style="margin-bottom:20px;">ประวัติและผลงาน</h2>
                    <div class="tl-tabs">
                        <button class="tl-tab active" data-tl="accomplishment">🏆 ผลงานที่ผ่านมา</button>
                        <button class="tl-tab" data-tl="promise">📋 นโยบายที่หาเสียง</button>
                        <button class="tl-tab" data-tl="undelivered">❌ ไม่ดำเนินการ / ผิดคำพูด</button>
                    </div>
                    <div id="tl-panel-accomplishment">${renderPolTimeline(p.timelineAccomplishments,'accomplishment')}</div>
                    <div id="tl-panel-promise" style="display:none;">${renderPolTimeline(p.timelinePromises,'promise')}</div>
                    <div id="tl-panel-undelivered" style="display:none;">${renderPolTimeline(p.timelineUndelivered,'undelivered')}</div>
                </div>

// ── TIMELINES ─────────────────────────────────────────────
function renderVerticalTimeline(timeline) {
    if (!timeline || timeline.length === 0) return '<div class="empty">ยังไม่มีความคืบหน้า</div>';
    const sorted = [...timeline].sort((a,b) => new Date(b.date)-new Date(a.date));
    return `<div class="timeline-vertical">${sorted.map(item => `
        <div class="timeline-item"><div class="timeline-box">
            <div class="timeline-date">${item.date}</div>
            <div>${item.description}</div>
            ${item.source ? `<div class="timeline-source">🔗 <a href="${item.source}" target="_blank">แหล่งข้อมูล</a></div>` : ''}
        </div></div>`).join('')}</div>`;
}

function renderHorizontalTimeline(timeline) {
    if (!timeline || timeline.length === 0) return '<div class="empty">ยังไม่มีเหตุการณ์</div>';
    const sorted = [...timeline].sort((a,b) => new Date(a.date)-new Date(b.date));
    return `<div class="timeline-horizontal">${sorted.map((item,i) => `
        <div class="timeline-h-item">
            <div style="display:flex;flex-direction:column;align-items:center;">
                <div class="timeline-h-node">📅</div>
                <div class="timeline-h-content">
                    <div class="timeline-date">${item.date}</div>
                    <div style="margin:5px 0;">${item.description}</div>
                    ${item.source ? `<div class="timeline-source">🔗 <a href="${item.source}" target="_blank">แหล่งข้อมูล</a></div>` : ''}
                </div>
            </div>
            ${i < sorted.length-1 ? '<div class="timeline-h-connector"></div>' : ''}
        </div>`).join('')}</div>`;
}

function renderPolTimeline(timeline, type) {
    if (!timeline || timeline.length === 0)
        return '<div class="empty" style="padding:24px;">ยังไม่มีข้อมูล</div>';
    const cfg = {
        accomplishment: { icon:'🏆', color:'#16a34a', bg:'#f0fdf4', border:'#bbf7d0' },
        promise:        { icon:'📋', color:'#1d4ed8', bg:'#eff6ff', border:'#bfdbfe' },
        undelivered:    { icon:'❌', color:'#dc2626', bg:'#fef2f2', border:'#fecaca' },
    };
    const c = cfg[type] || cfg.accomplishment;
    const sorted = [...timeline].sort((a,b) => new Date(b.date)-new Date(a.date));
    return `<div class="pol-timeline">${sorted.map(item => `
        <div class="pol-tl-item">
            <div class="pol-tl-dot" style="background:${c.color};">${c.icon}</div>
            <div class="pol-tl-line" style="background:${c.color};"></div>
            <div class="pol-tl-box" style="background:${c.bg};border-color:${c.border};">
                <div class="pol-tl-date" style="color:${c.color};">${item.date}</div>
                <div class="pol-tl-desc">${item.description}</div>
                ${item.source ? `<div class="timeline-source">🔗 <a href="${item.source}" target="_blank">แหล่งข้อมูล</a></div>` : ''}
            </div>
        </div>`).join('')}</div>`;
}

// ── FINANCE HELPERS ───────────────────────────────────────
function calcFinance(finance) {
    const p = finance.people    || 0;
    const c = finance.corporate || 0;
    const u = finance.undefined || 0;
    const total = p + c + u;
    if (total === 0) return { pPct:0, cPct:0, uPct:0, total:0 };
    return {
        pPct: Math.round((p/total)*100),
        cPct: Math.round((c/total)*100),
        uPct: Math.round((u/total)*100),
        total
    };
}
function fmtAmount(val, unit) {
    if (!val) return '0';
    return val.toLocaleString('th-TH') + (unit ? ' '+unit : '');
}

    const map = {};
    POLITICIANS_CONTACT.forEach(p => {

            map[d.toLowerCase()] = p.id;

    if (p.twitter)   links.push({ cls:'cl-tw',    icon:'🐦', label:'Twitter / X', val:p.twitter.replace('https://twitter.com/','@'),  href:p.twitter });
    if (p.instagram) links.push({ cls:'cl-ig',    icon:'📷', label:'Instagram',    val:p.instagram.replace('https://instagram.com/','@'), href:p.instagram });
    if (p.website)   links.push({ cls:'cl-web',   icon:'🌐', label:'เว็บไซต์',    val:p.website.replace('https://',''),               href:p.website });
    if (links.length === 0) return '<p style="color:#aaa;font-size:13px;grid-column:1/-1;">ยังไม่มีข้อมูลช่องทางติดต่อ</p>';
    return links.map(l => `
        <a class="cl-item ${l.cls}" href="${l.href}" target="_blank" rel="noopener">
            <span class="cl-icon">${l.icon}</span>
            <div style="min-width:0;">
                <div class="cl-label">${l.label}</div>
                <div class="cl-val">${l.val}</div>
            </div>
        </a>
    `).join('');
}

// ─── SEND: Render politician grid ────────────────────────
function sendRenderGrid(expandId) {
    const grid = document.getElementById('send-pol-grid');
    if (!grid) return;
    const filtered = POLITICIANS_CONTACT.filter(p => {
        const mp = sendActiveParty === 'all' || p.party === sendActiveParty;
        const mq = !sendSearchQuery ||
            p.name.includes(sendSearchQuery) ||
            p.party.includes(sendSearchQuery) ||
            p.region.includes(sendSearchQuery) ||
            (p.districts || []).some(d => d.includes(sendSearchQuery));
        return mp && mq;
    });
    if (filtered.length === 0) {
        grid.classList.remove('has-expanded');
        grid.innerHTML = '<div class="no-results">🔎 ไม่พบผู้แทนที่ตรงกับการค้นหา</div>';
        return;
    }

    const hasExpanded = !!expandId;
    grid.classList.toggle('has-expanded', hasExpanded);

    grid.innerHTML = filtered.map(p => {
        if (expandId && p.id === expandId) {
            // ── Expanded card (full-width, two-pane) ──
            const distTags = (p.districts || []).map(d => `<span class="district-tag">${d}</span>`).join('');
            return `
            <div class="send-pol-card expanded" data-id="${p.id}">
                <!-- LEFT pane: info + contact links -->
                <div class="spc-left">
                    <button class="spc-back" onclick="sendCollapse()">← กลับรายชื่อ</button>
                    <div class="party-badge" data-p="${p.party}" style="margin-bottom:14px;">${p.party}</div>
                    <div style="font-size:22px;font-weight:700;font-family:var(--fh);margin-bottom:4px;">${p.name}</div>
                    <div style="font-size:14px;color:var(--s600);margin-bottom:4px;">${p.position}</div>
                    <div style="font-size:13px;color:#777;margin-bottom:14px;">📍 ${p.region}</div>
                    ${distTags ? `<div class="districts-tags" style="margin-bottom:18px;">${distTags}</div>` : ''}
                    <div style="font-size:12px;font-weight:700;font-family:var(--fh);text-transform:uppercase;letter-spacing:.8px;color:var(--s600);margin-bottom:10px;">ช่องทางติดต่อ</div>
                    <div class="spc-links">${buildContactLinks(p)}</div>
                </div>
                <!-- RIGHT pane: compose form -->
                <div class="spc-right">
                    <div style="font-size:18px;font-weight:700;font-family:var(--fh);">✉️ ส่งข้อเสนอ</div>
                    <!-- Identity toggle -->
                    <div>
                        <div style="font-size:12px;font-weight:700;font-family:var(--fh);text-transform:uppercase;letter-spacing:.8px;color:var(--s600);margin-bottom:8px;">ส่งในนาม</div>
                        <div class="compose-toggle">
                            <button class="toggle-btn active" id="tbtn-anon" onclick="sendSetIdentity('anon')">🕵️ ไม่ระบุชื่อ</button>
                            <button class="toggle-btn" id="tbtn-named" onclick="sendSetIdentity('named')">🙋 ระบุชื่อของฉัน</button>
                        </div>
                    </div>
                    <div class="anon-note" id="send-anon-note">
                        ⚠️ ข้อเสนอของคุณจะส่งโดยไม่เปิดเผยตัวตน — ชื่อและอีเมลของคุณ<strong>จะไม่ถูกระบุ</strong>ในข้อความ
                    </div>
                    <div class="identity-fields hidden" id="send-identity-fields">
                        <div class="form-group">
                            <div class="form-label">ชื่อ-นามสกุล <span style="font-weight:400;color:#aaa;">(ไม่บังคับ)</span></div>
                            <input type="text" class="form-input" id="sender-name" placeholder="เช่น สมหญิง ใจดี" />

function sendFilter() {
    sendSearchQuery = document.getElementById('send-search-input')?.value.trim() || '';
    sendSelectedPol = null;
    sendRenderGrid();
}

function sendSelectParty(chip) {
    sendActiveParty = chip.dataset.party;
    document.querySelectorAll('.send-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    sendSelectedPol = null;
    sendRenderGrid();
}

// ─── SEND: Select politician → expand card inline ────────
function sendSelectPol(id) {
    sendSelectedPol = POLITICIANS_CONTACT.find(p => p.id === id);
    if (!sendSelectedPol) return;
    sendIsAnon = true;
    sendSelectedTopic = null;
    sendRenderGrid(id);
    // Scroll the expanded card into view
    setTimeout(() => {
        document.querySelector('.send-pol-card.expanded')?.scrollIntoView({ behavior:'smooth', block:'start' });
    }, 60);
}

// ─── SEND: Topic accordion ────────────────────────────────
function sendToggleTopicList() {
    const trigger = document.getElementById('topic-trigger');
    const list    = document.getElementById('topic-list');
    if (!trigger || !list) return;
    const isOpen = list.classList.contains('open');
    list.classList.toggle('open', !isOpen);
    trigger.classList.toggle('open', !isOpen);
}

function sendPickTopic(key) {
    // Toggle off if same key tapped again
    sendSelectedTopic = sendSelectedTopic === key ? null : key;

    // Update active state on list items
    document.querySelectorAll('.topic-list-item').forEach(b => {
        b.classList.toggle('active', b.dataset.key === sendSelectedTopic);
    });

    // Update trigger display
    const trigger  = document.getElementById('topic-trigger');
    const selIcon  = document.getElementById('topic-sel-icon');
    const selLabel = document.getElementById('topic-sel-label');
    const topicObj = SEND_TOPICS.find(t => t.key === sendSelectedTopic);

    if (topicObj && selIcon && selLabel) {
        selIcon.textContent  = topicObj.icon;
        selLabel.textContent = topicObj.th + ' — ' + topicObj.en;
    } else if (selIcon && selLabel) {
        selIcon.textContent  = '📌';
        selLabel.textContent = 'เลือกหัวข้อ...';
    }

    // Close the list after picking
    document.getElementById('topic-list')?.classList.remove('open');
    trigger?.classList.remove('open');
}

// ─── SEND: Collapse back to grid ─────────────────────────
function sendCollapse() {
    sendSelectedPol = null;
    sendRenderGrid();
}

// ─── SEND: Identity toggle ────────────────────────────────
function sendSetIdentity(mode) {
    sendIsAnon = mode === 'anon';
    document.getElementById('tbtn-anon').classList.toggle('active', sendIsAnon);
    document.getElementById('tbtn-named').classList.toggle('active', !sendIsAnon);
    document.getElementById('send-anon-note').style.display = sendIsAnon ? 'flex' : 'none';
    document.getElementById('send-identity-fields').classList.toggle('hidden', sendIsAnon);
}

// ─── SEND: Char count ─────────────────────────────────────
function sendUpdateChar() {
    const msg = document.getElementById('send-message')?.value || '';
    const el = document.getElementById('send-char-count');
    if (el) el.textContent = `${msg.length} / 1000 ตัวอักษร`;
    sendUpdateBtn();
}

function sendUpdateBtn() {
    const btn = document.getElementById('do-send-btn');
    if (!btn) return;
    const msg = document.getElementById('send-message')?.value.trim() || '';
    const hasEmail = sendSelectedPol && sendSelectedPol.email;
    btn.disabled = !msg || !hasEmail;
    if (sendSelectedPol && !hasEmail) {
        btn.innerHTML = '⚠️ ผู้แทนคนนี้ไม่มีข้อมูลอีเมล';
    } else {
        btn.innerHTML = '<span>📧</span> ส่งข้อเสนอทางอีเมล';
    }
}

// ─── SEND: Build mailto and open ─────────────────────────
function doSendMessage() {
    if (!sendSelectedPol || !sendSelectedPol.email) return;
    const msg = document.getElementById('send-message')?.value.trim();
    if (!msg) return;

    const senderName  = sendIsAnon ? null : (document.getElementById('sender-name')?.value.trim() || '');
    const senderEmail = sendIsAnon ? null : (document.getElementById('sender-email')?.value.trim() || '');

    // Resolve topic label
    const topicObj = SEND_TOPICS.find(t => t.key === sendSelectedTopic);
    const topicLine = topicObj ? `${topicObj.icon} ${topicObj.th} (${topicObj.en})` : null;

    const subjectTopic = topicObj ? ` [${topicObj.th}]` : '';
    const subject = sendIsAnon
        ? `[ข้อเสนอ — ไม่ระบุชื่อ]${subjectTopic} ถึง ${sendSelectedPol.name}`
        : `[ข้อเสนอ]${subjectTopic} ถึง ${sendSelectedPol.name} จาก ${senderName || 'ประชาชน'}`;

    let body = `เรียน ${sendSelectedPol.name}\n`;
    body += `ตำแหน่ง: ${sendSelectedPol.position} — ${sendSelectedPol.region}\n`;
    if (topicLine) body += `หัวข้อ: ${topicLine}\n`;
    body += `\n──────────────────────────────\n`;
    body += msg + '\n';
    body += `──────────────────────────────\n`;
    if (!sendIsAnon) {
        if (senderName)  body += `\nส่งโดย: ${senderName}`;
        if (senderEmail) body += `\nอีเมลผู้ส่ง: ${senderEmail}`;
    } else {
        body += `\n[ข้อความนี้ส่งโดยไม่ระบุชื่อผ่าน มองทะลุ.net]`;
    }
    body += `\n\nส่งผ่าน มองทะลุ.net`;

    window.location.href = `mailto:${sendSelectedPol.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    showToast('✅ เปิดโปรแกรมอีเมลแล้ว — กรุณาตรวจสอบและกดส่ง');
}

// ─── SEND: District lookup ────────────────────────────────
function sendLookupDistrict() {
    const val = document.getElementById('district-input')?.value.trim() || '';
    const resEl  = document.getElementById('district-result');
    const nfEl   = document.getElementById('district-not-found');
    districtFoundId = null;

    if (!val) { resEl.classList.remove('visible'); nfEl.classList.remove('visible'); return; }

    const DMAP = buildDistrictMap();
    const lval = val.toLowerCase();
    let found = null;
    for (const [k, v] of Object.entries(DMAP)) {
        if (k.includes(lval) || lval.includes(k)) { found = v; break; }
    }
    if (found) {
        const p = POLITICIANS_CONTACT.find(x => x.id === found);
        document.getElementById('dr-name').textContent = p.name;
        document.getElementById('dr-sub').textContent  = `พรรค${p.party} — ${p.position}`;
        districtFoundId = p.id;
        resEl.classList.add('visible');
        nfEl.classList.remove('visible');
    } else {
        document.getElementById('missing-district').textContent = val;
        resEl.classList.remove('visible');
        nfEl.classList.add('visible');
    }
}

function sendGotoRep() {
    if (!districtFoundId) return;
    sendShowTab('search');
    // small delay so tab switch renders before we expand
    setTimeout(() => sendSelectPol(districtFoundId), 30);
}

// ─── Toast ────────────────────────────────────────────────
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
}
