<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ราคาผลไม้ไทย — Thai Fruit Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0b0e0b;
  --surface:  #111511;
  --surface2: #161c16;
  --border:   #1f271f;
  --border2:  #2a382a;
  --text:     #d4e8d4;
  --muted:    #5a7a5a;
  --up:       #22c55e;
  --down:     #ef4444;
  --warn:     #f59e0b;
  --accent:   #86efac;
  --mono:     'IBM Plex Mono', monospace;
  --thai:     'Noto Sans Thai', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--thai);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); }

/* ── TICKER TAPE ── */
.ticker-wrap {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 7px 0;
  overflow: hidden;
  white-space: nowrap;
}

.ticker-inner {
  display: inline-block;
  animation: ticker 30s linear infinite;
}

@keyframes ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

.ticker-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-right: 40px;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
}

.ticker-name  { color: var(--muted); }
.ticker-price { color: var(--text); font-weight: 500; }
.ticker-chg.up   { color: var(--up); }
.ticker-chg.down { color: var(--down); }

/* ── HEADER ── */
header {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-sub {
  font-size: 0.65rem;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0.1em;
  border-left: 1px solid var(--border2);
  padding-left: 10px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
}

.live-dot {
  width: 6px; height: 6px;
  background: var(--up);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--up);
  animation: blink 2s infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── LAYOUT ── */
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 20px;
}

/* ── FRUIT LIST SIDEBAR ── */
.fruit-sidebar {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sidebar-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0 0 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}

.fruit-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: none;
  border: none;
  border-left: 2px solid transparent;
  cursor: pointer;
  transition: all 0.12s;
  width: 100%;
  text-align: left;
  gap: 8px;
}

.fruit-btn:hover   { background: var(--surface2); }
.fruit-btn.active  { background: var(--surface2); border-left-color: var(--accent); }

.fruit-btn-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.fruit-emoji { font-size: 1.1rem; }

.fruit-btn-name {
  font-family: var(--thai);
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.2;
}

.fruit-btn-en {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--muted);
}

.fruit-btn-price {
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 600;
  text-align: right;
}

.fruit-btn-chg {
  font-family: var(--mono);
  font-size: 0.6rem;
}

/* ── MAIN CONTENT ── */
.main-content { min-width: 0; }

/* ── FRUIT HERO ── */
.fruit-hero {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 20px 24px;
  margin-bottom: 16px;
}

.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}

.hero-name-th {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero-name-en {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 0.06em;
}

.hero-price-block { text-align: right; }

.hero-price {
  font-family: var(--mono);
  font-size: 2rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1;
}

.hero-price-unit {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.08em;
}

.hero-change {
  font-family: var(--mono);
  font-size: 0.85rem;
  font-weight: 600;
  margin-top: 4px;
}

.hero-change.up   { color: var(--up); }
.hero-change.down { color: var(--down); }

/* ── HML BAR ── */
.hml-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 0;
}

.hml-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 14px;
}

.hml-label {
  font-family: var(--mono);
  font-size: 0.58rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.hml-value {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 600;
}

.hml-high  .hml-value { color: var(--up); }
.hml-mid   .hml-value { color: var(--warn); }
.hml-low   .hml-value { color: var(--down); }
.hml-mkt   .hml-value { color: var(--accent); font-size: 0.82rem; }

/* ── CHART AREA ── */
.chart-section {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px 20px;
  margin-bottom: 16px;
}

.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.chart-title {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.chart-periods {
  display: flex;
  gap: 4px;
}

.period-btn {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  padding: 3px 9px;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.1s;
}

.period-btn:hover  { border-color: var(--border2); color: var(--text); }
.period-btn.active { background: var(--border2); color: var(--accent); border-color: var(--border2); }

/* SVG Chart */
.chart-canvas {
  width: 100%;
  height: 160px;
  position: relative;
}

.chart-canvas svg { width: 100%; height: 100%; }

/* ── PRICE TABLE ── */
.history-section {
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

.section-head {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
}

.price-table { width: 100%; border-collapse: collapse; }

.price-table th {
  padding: 8px 20px;
  text-align: left;
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  font-weight: 400;
}

.price-table td {
  padding: 9px 20px;
  font-family: var(--mono);
  font-size: 0.78rem;
  border-bottom: 1px solid var(--border);
}

.price-table tr:last-child td { border-bottom: none; }
.price-table tr:hover td { background: var(--surface2); }

.td-date  { color: var(--muted); }
.td-price { color: var(--text); font-weight: 500; }
.td-chg.up   { color: var(--up); }
.td-chg.down { color: var(--down); }
.td-market { color: var(--muted); font-size: 0.7rem; }

/* ── FORECAST ── */
.forecast-section {
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 16px;
  padding: 16px 20px;
}

.forecast-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-top: 12px;
}

.forecast-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 14px;
}

.forecast-period {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.forecast-price {
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--accent);
}

.forecast-note {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 3px;
}

/* ── THE BACK NOTE — Market Power Warning ── */
.back-note {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--warn);
  overflow: hidden;
}

.back-note-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
}

.back-tab {
  padding: 10px 18px;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: none;
  border: none;
  border-right: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.1s;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}

.back-tab:hover  { color: var(--text); background: var(--surface2); }
.back-tab.active { color: var(--warn); background: var(--surface2); border-bottom-color: var(--warn); }

.back-panel { display: none; padding: 18px 20px; }
.back-panel.active { display: block; }

.back-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--warn);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-body {
  font-size: 0.82rem;
  color: #8aaa8a;
  line-height: 1.85;
}

.back-body strong { color: var(--text); font-weight: 600; }
.back-body em     { color: var(--warn); font-style: normal; font-weight: 500; }

/* scenario flow */
.scenario {
  margin: 14px 0;
  border-left: 2px solid var(--border2);
  padding-left: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scenario-step {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 0.8rem;
  color: #8aaa8a;
  line-height: 1.65;
}

.step-num {
  font-family: var(--mono);
  font-size: 0.62rem;
  background: var(--border2);
  color: var(--muted);
  padding: 1px 6px;
  flex-shrink: 0;
  margin-top: 2px;
}

.step-num.bad { background: rgba(239,68,68,0.2); color: var(--down); }

/* fix items */
.fix-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.fix-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 2px solid var(--up);
  padding: 10px 14px;
}

.fix-item-title {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--up);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.fix-item-body {
  font-size: 0.78rem;
  color: #7a9a7a;
  line-height: 1.7;
}

/* sticker badge visual */
.sticker-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  padding: 4px 12px;
  margin: 8px 0;
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--up);
  letter-spacing: 0.08em;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  padding: 16px 24px;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  display: flex;
  justify-content: space-between;
  margin-top: 32px;
}

footer span { color: var(--accent); }

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .page { grid-template-columns: 1fr; padding: 14px; }
  .hml-row { grid-template-columns: repeat(2,1fr); }
  .forecast-row { grid-template-columns: 1fr; }
}
</style>
</head>

        { icon: "🏷️", title: "สติ๊กเกอร์รับรองส้มโอ direct trade", body: "ช่วยเกษตรกรขายตรงสู่ห้างฯ หรือผู้บริโภค ลดการผ่านคนกลางหลายชั้น เพิ่มรายได้ 3–5 เท่า", sticker: true },

let activeFruit = FRUITS[0].id;
let activePeriod = '1Y';
let activeBackTab = 'issue';

// ── CLOCK ──
function updateClock() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent =
    now.toLocaleTimeString('th-TH', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// ── TICKER ──
function buildTicker() {
  const items = FRUITS.map(f => {
    const chg = f.priceToday - f.priceYesterday;
    const pct = ((chg / f.priceYesterday) * 100).toFixed(1);
    const dir = chg >= 0 ? 'up' : 'down';
    const arrow = chg >= 0 ? '▲' : '▼';
    return `<span class="ticker-item">
      <span class="ticker-name">${f.emoji} ${f.nameTh}</span>
      <span class="ticker-price">฿${f.priceToday}</span>
      <span class="ticker-chg ${dir}">${arrow}${Math.abs(pct)}%</span>
    </span>`;
  });
  // duplicate for seamless loop
  const html = items.join('') + items.join('');
  document.getElementById('tickerInner').innerHTML = html;
}

// ── SIDEBAR ──
function buildSidebar() {
  const container = document.getElementById('fruitList');
  container.innerHTML = FRUITS.map(f => {
    const chg = f.priceToday - f.priceYesterday;
    const pct = ((chg / f.priceYesterday) * 100).toFixed(1);
    const dir = chg >= 0 ? 'up' : 'down';
    const arrow = chg >= 0 ? '▲' : '▼';
    return `
      <button class="fruit-btn ${f.id === activeFruit ? 'active' : ''}"
              id="btn-${f.id}" onclick="selectFruit('${f.id}')">
        <div class="fruit-btn-left">
          <span class="fruit-emoji">${f.emoji}</span>
          <div>
            <div class="fruit-btn-name">${f.nameTh}</div>
            <div class="fruit-btn-en">${f.nameEn}</div>
          </div>
        </div>
        <div>
          <div class="fruit-btn-price" style="color:var(--${dir})">${f.priceToday}</div>
          <div class="fruit-btn-chg" style="color:var(--${dir})">${arrow}${Math.abs(pct)}%</div>
        </div>
      </button>`;
  }).join('');
}

// ── SELECT FRUIT ──
function selectFruit(id) {
  activeFruit = id;
  document.querySelectorAll('.fruit-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + id).classList.add('active');
  renderMain();
}

// ── SVG CHART ──
function buildChart(f) {
  const pts = f.chartPoints;
  const max = Math.max(...pts);
  const min = Math.min(...pts);
  const W = 680, H = 140, pad = 10;
  const range = max - min || 1;

  const xs = pts.map((_, i) => pad + (i / (pts.length - 1)) * (W - 2 * pad));
  const ys = pts.map(v => H - pad - ((v - min) / range) * (H - 2 * pad));

  const linePath = xs.map((x, i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const areaPath = linePath + ` L${xs[xs.length-1].toFixed(1)},${H} L${xs[0].toFixed(1)},${H} Z`;

  const lastChg = pts[pts.length-1] - pts[pts.length-2];
  const colour = lastChg >= 0 ? '#22c55e' : '#ef4444';

  const labels = f.chartLabels.map((lbl, i) => {
    if (i % 3 !== 0) return '';
    return `<text x="${xs[i].toFixed(1)}" y="${H + 14}" text-anchor="middle"
              font-family="IBM Plex Mono" font-size="8" fill="#5a7a5a">${lbl}</text>`;
  }).join('');

  return `
    <svg viewBox="0 -4 ${W} ${H+20}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${colour}" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="${colour}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- grid lines -->
      ${[0,0.25,0.5,0.75,1].map(t => {
        const y = (pad + (1-t)*(H-2*pad)).toFixed(1);
        const val = (min + t * range).toFixed(0);
        return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}"
                  stroke="#1f271f" stroke-width="1"/>
                <text x="${pad}" y="${(parseFloat(y)-3).toFixed(1)}"
                  font-family="IBM Plex Mono" font-size="7" fill="#5a7a5a">${val}</text>`;
      }).join('')}
      <!-- area fill -->
      <path d="${areaPath}" fill="url(#areaGrad)"/>
      <!-- line -->
      <path d="${linePath}" fill="none" stroke="${colour}" stroke-width="1.5"/>
      <!-- dots -->
      ${xs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.5" fill="${colour}"/>`).join('')}
      <!-- labels -->
      ${labels}
    </svg>`;
}

// ── RENDER MAIN ──
function renderMain() {
  const f = FRUITS.find(x => x.id === activeFruit);
  if (!f) return;

  const chg = f.priceToday - f.priceYesterday;
  const pct = ((chg / f.priceYesterday) * 100).toFixed(1);
  const dir = chg >= 0 ? 'up' : 'down';
  const arrow = chg >= 0 ? '▲' : '▼';

  const historyRows = f.history.map(h => {
    const prevPrice = f.history[f.history.indexOf(h) + 1]?.price ?? h.price;
    const hChg = h.price - prevPrice;
    const hDir = hChg >= 0 ? 'up' : 'down';
    const hArrow = hChg >= 0 ? '▲' : '▼';
    return `<tr>
      <td class="td-date">${h.date}</td>
      <td class="td-price">฿${h.price}</td>
      <td class="td-chg ${hDir}">${hChg !== 0 ? hArrow + Math.abs(hChg) : '—'}</td>
      <td class="td-market">${h.market}</td>
    </tr>`;
  }).join('');

  const forecastBoxes = f.forecast.map(fc => `
    <div class="forecast-box">
      <div class="forecast-period">${fc.period}</div>
      <div class="forecast-price">${fc.price}</div>
      <div class="forecast-note">${fc.note}</div>
    </div>`).join('');

  // scenario steps
  const steps = f.issue.scenario.map(s => `
    <div class="scenario-step">
      <span class="step-num ${s.bad ? 'bad' : ''}">${s.n}</span>
      <span>${s.text}</span>
    </div>`).join('');

  // fix items
  const fixes = f.issue.fixes.map(fx => `
    <div class="fix-item">
      <div class="fix-item-title">${fx.icon} ${fx.title}</div>
      <div class="fix-item-body">${fx.body}
        ${fx.sticker ? `<br><span class="sticker-badge">✓ ETHICAL MIDDLEMAN CERTIFIED · คนกลางที่ได้รับการรับรอง</span>` : ''}
      </div>
    </div>`).join('');

  document.getElementById('mainContent').innerHTML = `

    <!-- HERO -->
    <div class="fruit-hero">
      <div class="hero-top">
        <div>
          <div class="hero-name-th">${f.emoji} ${f.nameTh}</div>
          <div class="hero-name-en">${f.nameEn} · ${f.mainMarket}</div>
        </div>
        <div class="hero-price-block">
          <div class="hero-price">฿${f.priceToday}</div>
          <div class="hero-price-unit">${f.unit} · วันนี้</div>
          <div class="hero-change ${dir}">${arrow} ฿${Math.abs(chg)} (${Math.abs(pct)}%)</div>
        </div>
      </div>
      <div class="hml-row">
        <div class="hml-box hml-high">
          <div class="hml-label">High 52W</div>
          <div class="hml-value">฿${f.high52w}</div>
        </div>
        <div class="hml-box hml-mid">
          <div class="hml-label">Mid 52W</div>
          <div class="hml-value">฿${f.mid52w}</div>
        </div>
        <div class="hml-box hml-low">
          <div class="hml-label">Low 52W</div>
          <div class="hml-value">฿${f.low52w}</div>
        </div>
        <div class="hml-box hml-mkt">
          <div class="hml-label">Main Market</div>
          <div class="hml-value">${f.mainMarket}</div>
        </div>
      </div>
    </div>

    <!-- CHART -->
    <div class="chart-section">
      <div class="chart-header">
        <span class="chart-title">// ประวัติราคา 12 เดือน / 12-Month Price History</span>
        <div class="chart-periods">
          <button class="period-btn active">1Y</button>
        </div>
      </div>
      <div class="chart-canvas">${buildChart(f)}</div>
    </div>

    <!-- HISTORY TABLE -->
    <div class="history-section">
      <div class="section-head">
        <span>// ราคารายวัน / Daily Prices</span>
        <span>${f.unit}</span>
      </div>
      <table class="price-table">
        <thead>
          <tr>
            <th>วันที่</th>
            <th>ราคา</th>
            <th>เปลี่ยนแปลง</th>
            <th>ตลาด</th>
          </tr>
        </thead>
        <tbody>${historyRows}</tbody>
      </table>
    </div>

    <!-- FORECAST -->
    <div class="forecast-section">
      <div class="section-head" style="padding:0 0 0;border:none;">
        <span>// ราคาคาดการณ์ / Price Forecast</span>
      </div>
      <div class="forecast-row">${forecastBoxes}</div>
    </div>

    <!-- BACK NOTE -->
    <div class="back-note">
      <div class="back-note-tabs">
        <button class="back-tab active" onclick="switchBack(this,'issue')">⚠ วงจรราคา</button>
        <button class="back-tab" onclick="switchBack(this,'fix')">✦ แนวทางแก้ไข</button>
      </div>

      <div class="back-panel active" id="bp-issue">
        <div class="back-title">⚠ ${f.issue.title}</div>
        <div class="back-body">
          ระบบตลาดผลไม้ไทยมีโครงสร้างที่ทำให้ผู้ซื้อรายใหญ่มีอำนาจต่อรองเหนือเกษตรกรอย่างไม่สมดุล:
          <div class="scenario">${steps}</div>
          <em>ผลลัพธ์: เกษตรกรแบกรับต้นทุนทั้งหมด แต่ได้รับผลตอบแทนน้อยที่สุดในห่วงโซ่</em>
        </div>
      </div>

      <div class="back-panel" id="bp-fix">
        <div class="back-title">✦ แนวทางแก้ไขเชิงระบบ</div>
        <div class="back-body">
          ปัญหานี้ไม่ใช่ความโลภของบุคคล — แต่เป็น<strong>โครงสร้างตลาดที่ขาดทางเลือก</strong>
          เกษตรกรไม่สามารถต่อรองได้เมื่อไม่มีผู้ซื้อรายอื่น แนวทางแก้ไขต้องสร้างทางเลือกและอำนาจต่อรองขึ้นมาใหม่:
          <div class="fix-list">${fixes}</div>
          <br>
          <em>หลักการสำคัญ: ผู้บริโภคที่ซื้อจากคนกลางที่ดี = สนับสนุนให้เกษตรกรได้ราคาที่เป็นธรรม = ผลไม้คุณภาพดีกว่า = ทุกฝ่ายได้ประโยชน์</em>
        </div>
      </div>

    </div>`;
}

function switchBack(btn, tab) {
  document.querySelectorAll('.back-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.back-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('bp-' + tab).classList.add('active');
}

// ── INIT ──
buildTicker();
buildSidebar();
renderMain();
</script>
